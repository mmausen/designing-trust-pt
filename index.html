<!DOCTYPE html>
<!-- `lang` starts at the default and is kept in sync by the switcher (main.js) -->
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BDR x DFKI</title>
<link rel="stylesheet" href="styles-accessible.css?v=65"/>
</head>
<body>

<!-- language switcher — fixed top-right, available on every screen -->
<div id="lang-switch" role="group" aria-label="Language">
  <button type="button" class="lang-btn" data-lang="de">DE</button>
  <button type="button" class="lang-btn" data-lang="en">EN</button>
</div>

<!-- ════════════ DESKTOP REQUIRED ════════════
     Hard gate, not a Flow step: the cursor IS the AI's embodiment, so a
     touch device cannot run this study at all. Shown instead of everything
     else and never left. -->
<section id="screen-mobile" class="screen" hidden>
  <div class="centered">
    <h1 class="screen-kicker">BDR x DFKI</h1>
    <div class="gate-box">
      <div class="gate-icon" aria-hidden="true">🖱️</div>
      <h2 data-i18n="ui.mobile.heading"></h2>
      <p data-i18n="ui.mobile.body"></p>
      <p class="muted" data-i18n="ui.mobile.hint"></p>
    </div>
  </div>
</section>

<!-- ════════════ RESUME ════════════
     Shown INSTEAD of the normal first screen, and only when an interrupted
     session for this build is in localStorage. Its own screen, so the offer
     does not ride on whichever slide happens to come first. -->
<section id="screen-resume" class="screen" hidden>
  <div class="centered">
    <h1 class="screen-kicker">BDR x DFKI</h1>
    <div class="consent-box">
      <h2 id="resume-heading"></h2>
      <p id="resume-body"></p>
    </div>
    <div class="start-row">
      <button class="btn btn-primary" id="btn-resume-sess"></button>
      <button class="btn" id="btn-discard-sess"></button>
    </div>
  </div>
</section>

<!-- ════════════ PROLIFIC ID ════════════
     Optional step (Config.STEPS.prolificId). The participant id used for
     filenames and the group ledger stays the auto-generated one — this is
     recorded alongside it, so a run can be matched to a Prolific submission
     without letting participant-supplied text reach the filesystem. -->
<section id="screen-prolific" class="screen" hidden>
  <div class="centered">
    <h1 class="screen-kicker">BDR x DFKI</h1>
    <div class="consent-box">
      <h2 data-i18n="ui.prolific.heading"></h2>
      <p data-i18n="ui.prolific.body"></p>
      <label class="pid-row">
        <span data-i18n="ui.prolific.label"></span>
        <input type="text" id="prolific-input" autocomplete="off" spellcheck="false"/>
      </label>
      <p class="pid-error" id="prolific-error" hidden></p>
    </div>
    <div class="start-row">
      <button class="btn btn-primary" id="btn-prolific-next"></button>
    </div>
  </div>
</section>

<!-- ════════════ SURVEY (pre & post reuse this screen) ════════════ -->
<section id="screen-survey" class="screen" hidden>
  <div class="centered survey-wrap">
    <h1 class="screen-kicker" id="survey-kicker"></h1>
    <h2 id="survey-title"></h2>
    <form id="survey-form" class="survey-form" onsubmit="return false"></form>
    <div class="survey-footer">
      <span class="muted" id="survey-note"></span>
      <button class="btn btn-primary" id="btn-survey-next"></button>
    </div>
  </div>
</section>

<!-- ════════════ TASK ════════════ -->
<section id="screen-task" class="screen screen-task" hidden>
  <div id="banner">
    <div class="b-logo">BDR x DFKI</div>
    <div class="b-div"></div>
    <div class="b-prox" id="b-prox"></div>
    <div class="b-badge" id="b-badge" hidden></div>
  </div>

  <div class="task-brief">
    <div class="task-title" id="task-title"></div>
    <div class="task-desc" id="task-desc"></div>
  </div>

  <div id="main">
    <div class="col" id="col-inbox">
      <div class="col-hd" id="inbox-hd"></div>
      <div class="scroll" id="inbox"></div>
    </div>
    <div class="col" id="col-ladder">
      <div class="col-hd" id="ladder-hd"></div>
      <div class="ladder" id="ladder"></div>
    </div>
  </div>

  <!-- AI control block. One element, two mechanics, so both stages have the
       same layout and the block always sits in the same place:
         handoff — an activation ZONE. Park the real cursor inside it and the
                   AI takes the shared cursor and carries on; move the cursor
                   out and control returns instantly.
         hidden  — a BUTTON ("Start AI"). One press and the AI places every
                   step at once, with no cursor of its own.
       Hidden for the solo baseline, which has no AI at all. -->
  <button type="button" id="ai-zone" hidden>
    <span class="ai-zone-dot" aria-hidden="true"></span>
    <span class="ai-zone-label" id="ai-zone-label"></span>
  </button>

  <div id="footer">
    <button class="btn" id="btn-explainer"></button>
    <div class="hint" id="hint"></div>

    <div class="footer-right">
      <button class="btn btn-primary" id="btn-confirm" disabled></button>
    </div>
  </div>

  <!-- explainer tile (shown at task start; reopened via the bottom-left Explainer button) -->
  <div id="explainer-overlay" hidden>
    <div class="explainer-card">
      <div class="explainer-title" id="explainer-title"></div>
      <div class="explainer-body" id="explainer-body"></div>
      <button class="btn btn-primary" id="explainer-ok"></button>
    </div>
  </div>
</section>

<!-- ════════════ DEBRIEF / OVERALL ════════════ -->
<section id="screen-debrief" class="screen" hidden>
  <div class="or-header">
    <h2 id="db-title"></h2>
    <span class="or-sub" id="db-sub"></span>
  </div>
  <div class="db-thanks">
    <p id="db-thanks"></p>
    <p class="muted" id="db-sync-note"></p>
  </div>
  <div class="or-footer">
    <button class="btn btn-primary" id="btn-end"></button>
  </div>
</section>

<!-- ════════════ END — terminal screen, nothing follows ════════════ -->
<section id="screen-end" class="screen" hidden>
  <div class="centered end-wrap">
    <div class="end-mark" aria-hidden="true">✓</div>
    <h1 id="end-title"></h1>
    <p class="muted" id="end-note"></p>
  </div>
</section>

<!-- ════════════ FLOATING HELPERS (task overlays) ════════════ -->
<div id="drag-ghost">
  <div class="card-title" id="ghost-title"></div>
</div>

<!-- flight layer (hidden stages): the tile copies that fly from wherever a
     step sits to the slot the AI chose. Empty except during that ~1 s. -->
<div id="fly-layer" aria-hidden="true"></div>

<!-- AI cursor (handoff stages): pointer + an "AI" tag that travels with it -->
<div id="ai-cursor">
  <div class="ai-ring"></div>
  <svg class="ai-arrow" viewBox="0 0 26 30" width="26" height="30" aria-hidden="true">
    <path d="M2 2 L2 22 L8 17 L12 25 L15.5 23.5 L11.5 15.5 L19 15.5 Z"
          fill="#fff" stroke="#1d1d1f" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>
  <div class="ai-tag">AI</div>
</div>

<!-- dev-only controls — hidden unless Config.CONFIG.devMode is true (see main.js).
     The group picker forces this session's setup (G1–G4: AI character plus
     the order of the two mechanics); such sessions are flagged and left out
     of the balancing counts. -->
<div id="dev-bar" hidden>
  <select id="dev-group" title="Force this session's setup — character + mechanic order (dev only)"></select>
  <button id="dev-skip" type="button" title="Skip to the next stage (dev only)">Skip ▸</button>
</div>

<!-- ════════════ SCRIPTS (load order = dependency order) ════════════ -->
<script src="js/config.js?v=65"></script>
<script src="js/cursor.js?v=65"></script>
<script src="js/i18n.js?v=65"></script>
<script src="js/tasks.js?v=65"></script>
<!-- balanced G1–G4 assignment (needs Config; used by main.js) -->
<script src="js/groups.js?v=65"></script>
<script src="js/store.js?v=65"></script>
<script src="js/prolific.js?v=65"></script>
<script src="js/survey.js?v=65"></script>
<script src="js/task.js?v=65"></script>
<script src="js/results.js?v=65"></script>
<script src="js/flow.js?v=65"></script>
<script src="js/main.js?v=65"></script>
</body>
</html>
